system_prompt_path: marble/agent/werewolf_prompts/system_prompt.yaml
roles:
  - wolf
  - wolf
  - wolf
  - villager
  - villager
  - villager
  - seer
  - witch
  - guard
randomize_roles: True
use_random_names: True

# Model/key/URL are controlled by LLM_SOURCE in the .env file.
# Optional model_name overrides are honored only when they match the active source.
villager_config:
  model_name: ""
werewolf_config:
  model_name: ""
eval_config:
  model_name: ""

cooperation_mode: "cooperative"
use_daily_tasks: True
